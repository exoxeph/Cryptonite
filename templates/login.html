{% extends "base.html" %}{% block title %}Sign in | Authority Bridged{% endblock %}{% block content %}<section class="form-shell"><div class="auth-intro"><p class="eyebrow">Welcome back</p><h1>Sign in to continue</h1><p class="lead" style="margin-inline:auto">Access your complaints and private conversations.</p></div><div class="form-card surface">{% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}<form method="post"><div class="field"><label for="email">University email</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="button button-primary" type="submit" style="width:100%">Sign in</button></form><p class="form-footer">New to Authority Bridged? <a href="{{ url_for('auth.register') }}">Create a Student account</a></p></div></section>{% endblock %}
