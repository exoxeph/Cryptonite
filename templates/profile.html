{% extends "base.html" %}
{% block title %}Profile - Authority Bridged{% endblock %}
{% block content %}
<h1>Profile</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
{% if profile %}
<form method="post">
  <label>Name <input name="name" value="{{ profile.name }}" required></label>
  <label>Email <input name="email" type="email" value="{{ profile.email }}" required></label>
  <label>Contact <input name="contact" value="{{ profile.contact }}" required></label>
  <button type="submit">Update profile</button>
</form>
{% endif %}
{% endblock %}
